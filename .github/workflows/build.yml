name: Build

on:
  push:
    paths:
      - rush.yml
      - src/**
      - assets/**
      - deps/**
      - res/**
      - samples/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - rush.yml
      - src/**
      - assets/**
      - deps/**
      - res/**
      - samples/**
      - .github/workflows/build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: shreyashsaitwal/rush-cli@v2
      - run: rush build
      - name: Package the Video Call sample
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo zainulhassan815/supabase-appinventor --pattern dev.dreamerslab.supabase.aix --dir "$RUNNER_TEMP"
          python3 samples/package.py out "$RUNNER_TEMP/dev.dreamerslab.supabase.aix"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}
          path: out/
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(yq .version rush.yml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in rush.yml"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" out/* --generate-notes
